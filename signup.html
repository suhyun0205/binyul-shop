<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 - 소소기프트</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { brand: '#1D4ED8', navy: '#1E293B', sale: '#C92A2A' },
        fontFamily: { sans: ['Pretendard', 'Malgun Gothic', 'sans-serif'] }
      }
    }
  };
</script>
<style>
  body { font-family: 'Pretendard', 'Malgun Gothic', sans-serif; }
  .auth-message { font-size: 12px; min-height: 16px; margin-top: 10px; text-align: center; }
  .auth-message.success { color: #16A34A; font-weight: 700; }
  .auth-message.error { color: #C92A2A; font-weight: 700; }
</style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">

  <header class="bg-white border-b border-gray-200">
    <div class="max-w-[480px] mx-auto px-4 py-4 flex items-center gap-2">
      <a href="index.html" class="flex items-center gap-2">
        <img src="images/logo.svg" alt="소소기프트 로고" class="w-8 h-8">
        <h1 class="text-lg font-black tracking-tight">소소<span class="text-brand">기프트</span></h1>
      </a>
    </div>
  </header>

  <main class="flex-1 flex items-start sm:items-center justify-center px-4 py-10">
    <div class="w-full max-w-[380px] bg-white rounded-xl shadow-sm border border-gray-100 p-7">
      <h2 class="text-xl font-black text-center mb-1">회원가입</h2>
      <p class="text-xs text-gray-400 text-center mb-6">몇 가지 정보만 입력하면 가입 완료!</p>

      <label for="auth-name" class="sr-only">이름</label>
      <input type="text" id="auth-name" placeholder="이름" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm mb-2.5 focus:outline-none focus:border-brand">
      <label for="auth-email" class="sr-only">이메일</label>
      <input type="email" id="auth-email" placeholder="이메일" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm mb-2.5 focus:outline-none focus:border-brand">
      <label for="auth-password" class="sr-only">비밀번호</label>
      <input type="password" id="auth-password" placeholder="비밀번호" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm mb-2.5 focus:outline-none focus:border-brand">
      <label for="auth-password-confirm" class="sr-only">비밀번호 확인</label>
      <input type="password" id="auth-password-confirm" placeholder="비밀번호 확인" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm mb-2.5 focus:outline-none focus:border-brand" onkeydown="if(event.key==='Enter'){handleSignUp();}">
      <button class="w-full border-2 border-brand text-brand font-black text-sm py-3 rounded-lg mb-1 hover:bg-brand hover:text-white transition" onclick="handleSignUp()">회원가입</button>
      <div id="signup-message" class="auth-message"></div>

      <div class="text-center text-xs text-gray-500 mt-6 pt-5 border-t border-gray-100">
        이미 계정이 있으신가요? <a href="login.html" class="text-brand font-bold hover:underline">로그인</a>
      </div>
      <div class="text-center text-xs text-gray-400 mt-3">
        <a href="index.html" class="hover:underline"><i class="fa-solid fa-arrow-left"></i> 쇼핑몰로 돌아가기</a>
      </div>
    </div>
  </main>

  <!-- Supabase 클라이언트 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    // 인증 화면의 안내 문구 표시
    function showAuthMessage(elementId, text, isError) {
      var msgEl = document.getElementById(elementId);
      msgEl.textContent = text;
      msgEl.className = 'auth-message' + (isError ? ' error' : ' success');
    }

    // 회원가입 버튼 클릭
    function handleSignUp() {
      var name = document.getElementById('auth-name').value.trim();
      var email = document.getElementById('auth-email').value.trim();
      var password = document.getElementById('auth-password').value;
      var passwordConfirm = document.getElementById('auth-password-confirm').value;

      if (!name) {
        showAuthMessage('signup-message', '이름을 입력해주세요.', true);
        return;
      }
      if (password !== passwordConfirm) {
        showAuthMessage('signup-message', '비밀번호가 일치하지 않습니다.', true);
        return;
      }

      supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: { data: { name: name } }
      }).then(function (result) {
        if (result.error) {
          showAuthMessage('signup-message', translateAuthError(result.error.message), true);
        } else {
          showAuthMessage('signup-message', '가입이 완료되었습니다. 로그인 화면으로 이동합니다...', false);
          setTimeout(function () {
            location.href = 'login.html';
          }, 1200);
        }
      });
    }
  </script>
</body>
</html>
